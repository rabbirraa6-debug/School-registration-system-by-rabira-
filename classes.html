<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes - Connection Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .box {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eef3f8;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    button {
      margin-top: 15px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Classes</h1>
  <p>This is a Supabase connection test.</p>

  <div id="status">Starting...</div>

  <button onclick="testConnection()">Test Again</button>
</div>

<script>
const SUPABASE_URL = "https://goongxvoooiwsesqoptz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3c2Q-C0yO0k3MQeT0z2y0Q_-IKV7Eug";

const statusBox = document.getElementById("status");

function show(message) {
  statusBox.textContent += "\n" + message;
}

async function testConnection() {

  statusBox.textContent = "Starting Supabase test...";

  try {

    if (!window.supabase) {
      show("ERROR: Supabase library did not load.");
      return;
    }

    show("Supabase library loaded.");

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    show("Supabase client created.");

    show("Testing school_years table...");

    const { data, error } = await client
      .from("school_years")
      .select("*")
      .limit(5);

    if (error) {
      show("DATABASE ERROR:");
      show(error.message);
      show("\nDetails:");
      show(JSON.stringify(error, null, 2));
      return;
    }

    show("SUCCESS!");
    show("Database connection works.");

    show("\nSchool years returned:");

    if (!data || data.length === 0) {
      show("No school-year records found.");
    } else {
      show(JSON.stringify(data, null, 2));
    }

  } catch (err) {

    show("JAVASCRIPT ERROR:");
    show(err.message);

  }
}

testConnection();
</script>

</body>
</html>
