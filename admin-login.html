<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | School Registration System</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --navy: #071a2b;
      --navy-light: #102a43;
      --sky: #168aad;
      --sky-light: #e8f7fb;
      --green: #176b45;
      --background: #f4f8fb;
      --surface: #ffffff;
      --border: #d9e2ec;
      --text: #102a43;
      --muted: #627d98;
      --danger: #b42318;
      --danger-light: #fef3f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    input {
      user-select: text;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
    }

    header p {
      font-size: 12px;
      color: #b8c7d9;
      margin-top: 3px;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 35px 18px 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(7, 26, 43, 0.07);
    }

    .login-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 15px;
      border-radius: 16px;
      background: var(--sky-light);
      color: var(--sky);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-heading h2 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .login-heading p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: var(--sky-light);
      color: var(--sky);
      font-size: 11px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      width: 19px;
      height: 19px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 14px 0 44px;
      font-size: 18px;
      color: var(--text);
      background: white;
      outline: none;
      transition: 0.2s;
      letter-spacing: 8px;
      font-weight: 700;
      text-align: center;
    }

    input:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 3px rgba(22, 138, 173, 0.12);
    }

    .pin-note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .message {
      display: none;
      padding: 11px 12px;
      border-radius: 9px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .error-message {
      background: var(--danger-light);
      border: 1px solid #fecdca;
      color: var(--danger);
    }

    .success-message {
      background: #eefbf4;
      border: 1px solid #b7e4ca;
      color: var(--green);
    }

    .login-button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 10px;
      background: var(--navy);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: 0.2s;
    }

    .login-button:hover {
      background: var(--navy-light);
    }

    .login-button:active {
      transform: scale(0.99);
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 20px;
      padding: 12px;
      background: #f7fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .security-note svg {
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--green);
    }

    .back-button {
      width: 100%;
      margin-top: 15px;
      height: 45px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-button:hover {
      background: #f7fafc;
    }

    @media (min-width: 600px) {
      main {
        padding-top: 55px;
      }

      .login-card {
        padding: 34px 32px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-icon">
    <i data-lucide="shield-check"></i>
  </div>

  <div>
    <h1>School Registration System</h1>
    <p>Administration</p>
  </div>

</header>


<main>

  <section class="login-card">

    <div class="login-heading">

      <div class="login-icon">
        <i data-lucide="shield-check" width="30" height="30"></i>
      </div>

      <h2>Administrator Login</h2>

      <p>
        Enter the administrator security PIN to continue.
      </p>

      <div class="admin-badge">
        <i data-lucide="lock-keyhole" width="13" height="13"></i>
        Restricted Access
      </div>

    </div>


    <div id="errorMessage"
         class="message error-message"></div>

    <div id="successMessage"
         class="message success-message"></div>


    <form id="adminLoginForm">

      <div class="field">

        <label for="pin">
          Administrator PIN
        </label>

        <div class="input-wrapper">

          <i class="input-icon"
             data-lucide="key-round"></i>

          <input
            type="password"
            id="pin"
            placeholder="••••••"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]{6}"
            autocomplete="off"
            required
          >

        </div>

        <div class="pin-note">
          Enter your 6-digit administrator PIN.
        </div>

      </div>


      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >

        <i data-lucide="log-in"
           width="18"
           height="18"></i>

        <span id="loginButtonText">
          Sign In
        </span>

      </button>

    </form>


    <div class="security-note">

      <i data-lucide="shield-check"
         width="18"
         height="18"></i>

      <div>
        Administrator access is restricted to authorized
        school administration personnel.
      </div>

    </div>


    <button
      class="back-button"
      onclick="goHome()"
    >
      Back to Home
    </button>

  </section>

</main>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://goongxvoooiwsesqoptz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_3c2Q-C0yO0k3MQeT0z2y0Q_-IKV7Eug";

  const db =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ================================
     ELEMENTS
  ================================= */

  const form =
    document.getElementById("adminLoginForm");

  const pinInput =
    document.getElementById("pin");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");

  const loginButton =
    document.getElementById("loginButton");

  const loginButtonText =
    document.getElementById("loginButtonText");


  /* ================================
     PIN INPUT
  ================================= */

  pinInput.addEventListener("input", function () {

    this.value =
      this.value
        .replace(/\D/g, "")
        .slice(0, 6);

  });


  /* ================================
     MESSAGE HELPERS
  ================================= */

  function showError(message) {

    successMessage.style.display = "none";

    errorMessage.textContent = message;

    errorMessage.style.display = "block";

  }


  function showSuccess(message) {

    errorMessage.style.display = "none";

    successMessage.textContent = message;

    successMessage.style.display = "block";

  }


  /* ================================
     ADMIN LOGIN
  ================================= */

  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    errorMessage.style.display = "none";
    successMessage.style.display = "none";

    const pin =
      pinInput.value.trim();


    if (!/^\d{6}$/.test(pin)) {

      showError(
        "Please enter a valid 6-digit PIN."
      );

      return;

    }


    loginButton.disabled = true;

    loginButtonText.textContent =
      "Checking...";


    try {

      const { data, error } =
        await db.rpc(
          "verify_admin_pin",
          {
            input_pin: pin
          }
        );


      if (error) {

        console.error(error);

        showError(
          "Unable to verify the administrator PIN."
        );

        return;

      }


      if (data !== true) {

        showError(
          "Incorrect administrator PIN."
        );

        pinInput.value = "";

        pinInput.focus();

        return;

      }


      /* ================================
         SUCCESS
      ================================= */

      showSuccess(
        "PIN verified. Opening administrator dashboard..."
      );


      /*
        Temporary login session.

        This allows admin.html to know that
        the PIN was successfully verified.
      */

      sessionStorage.setItem(
        "admin_authenticated",
        "true"
      );


      setTimeout(function () {

        window.location.href =
          "admin.html";

      }, 600);


    } catch (error) {

      console.error(error);

      showError(
        "Could not connect to the database."
      );

    } finally {

      loginButton.disabled = false;

      loginButtonText.textContent =
        "Sign In";

    }

  });


  /* ================================
     HOME
  ================================= */

  function goHome() {

    window.location.href =
      "index.html";

  }


  /* ================================
     ICONS
  ================================= */

  lucide.createIcons();

</script>

</body>
</html>
